<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasySkill — Gestion de centre de formation</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#1e3a8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&family=Cormorant+Garamond:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0a1730; --navy-900:#152a6e; --navy-800:#1b3480; --navy-700:#2749b8; --navy-600:#3358d4; --navy-300:#a9c0f2;
    --orange-400:#fbbf24; --orange-500:#f59e0b; --orange-600:#ea580c; --orange-700:#c2410c;
    --emerald-600:#059669; --emerald-500:#10b981; --emerald-100:#d1fae5; --emerald-700:#047857;
    --red-600:#dc2626; --red-500:#ef4444; --red-100:#fee2e2; --red-700:#b91c1c;
    --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
    --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b;
    --radius-sm:9px; --radius-md:12px; --radius-lg:17px; --radius-xl:22px;
    --shadow-sm:0 2px 8px rgba(15,31,71,.06);
    --shadow-md:0 8px 22px rgba(15,31,71,.10);
    --shadow-lg:0 20px 48px rgba(10,23,48,.22);
    --ease:cubic-bezier(.4,0,.2,1);
    --font-head:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-diploma-head:'Playfair Display',Georgia,'Times New Roman',serif;
    --font-diploma-body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:var(--font-body);background:
      radial-gradient(circle at 8% 0%, rgba(39,73,184,.10) 0%, transparent 45%),
      radial-gradient(circle at 100% 8%, rgba(245,158,11,.12) 0%, transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(16,185,129,.05) 0%, transparent 40%),
      linear-gradient(180deg,#eef2fb 0%,var(--slate-50) 320px);
    background-attachment:fixed;color:var(--slate-800);-webkit-font-smoothing:antialiased;line-height:1.45;}
  ::selection{background:var(--orange-500);color:#fff;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:99px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--slate-400);}
  button{font-family:inherit;cursor:pointer;border:none;transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),opacity .2s var(--ease);}
  button:active{transform:scale(.97);}
  input,select,textarea{font-family:inherit;transition:border-color .18s var(--ease),box-shadow .18s var(--ease);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.90);backdrop-filter:blur(10px) saturate(160%);border-bottom:1px solid var(--slate-200);box-shadow:0 1px 0 0 rgba(15,31,71,.03);}
  .topbar::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--navy-900),var(--navy-600) 45%,var(--orange-500) 100%);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 0;flex-wrap:wrap;gap:14px;}
  .topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-badge{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--navy-950),var(--navy-700) 55%,var(--orange-500));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:800;font-size:16px;flex-shrink:0;box-shadow:0 3px 10px rgba(15,31,71,.28);}
  .logo-text{line-height:1.1;}
  .logo-title{font-family:var(--font-head);font-weight:800;font-size:16.5px;color:var(--navy-950);}
  .logo-title span{color:var(--orange-600);}
  .logo-sub{font-size:10.5px;color:var(--slate-500);font-weight:600;letter-spacing:.02em;}
  .page-title{font-family:var(--font-head);font-weight:700;font-size:15px;color:var(--navy-950);}
  .logout-btn{display:flex;align-items:center;gap:6px;background:var(--slate-100);border:1px solid var(--slate-200);color:var(--slate-600);padding:8px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;}
  .logout-btn:hover{background:var(--slate-200);color:var(--slate-800);}
  .sync-badge{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--slate-500);white-space:nowrap;}
  .sync-badge.sync-ok{color:#15803d;}
  .sync-badge.sync-warn{color:#b45309;}
  .sync-badge.sync-busy{color:var(--slate-500);}
  @media (max-width:640px){ .sync-badge{display:none;} }
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{white-space:nowrap;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--slate-600);background:#fff;border:1px solid var(--slate-200);box-shadow:0 1px 2px rgba(15,31,71,.04);}
  .tab-btn:hover{border-color:var(--navy-300);color:var(--navy-900);background:#fbfcff;}
  .tab-btn.active{background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;border-color:var(--navy-900);box-shadow:0 4px 14px rgba(21,42,110,.28);}

  /* --- Menu latéral (Espace Secrétariat) --- */
  .hamburger-btn{border:none;background:var(--slate-100);color:var(--navy-950);width:48px;height:48px;border-radius:13px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .18s var(--ease);}
  .hamburger-btn:hover{background:var(--slate-200);}
  .sec-drawer-backdrop{position:fixed;inset:0;background:rgba(10,23,48,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s var(--ease);}
  .sec-drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .sec-drawer{position:fixed;top:0;left:0;height:100vh;width:290px;max-width:85vw;background:#fff;z-index:61;box-shadow:10px 0 30px rgba(10,23,48,.25);transform:translateX(-100%);transition:transform .28s var(--ease);display:flex;flex-direction:column;}
  .sec-drawer.open{transform:translateX(0);}
  .sec-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--slate-200);font-weight:800;color:var(--navy-950);font-size:14.5px;flex-shrink:0;font-family:var(--font-head);}
  .drawer-close-btn{border:none;background:var(--slate-100);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--slate-600);}
  .drawer-close-btn:hover{background:var(--slate-200);}
  .sec-drawer-body{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
  .drawer-tab{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;font-size:14px;font-weight:700;text-align:left;background:transparent;color:var(--slate-600);border:none;cursor:pointer;transition:color .18s var(--ease),background .18s var(--ease);}
  .drawer-tab .tab-ic{font-size:15px;}
  .drawer-tab:hover{background:var(--slate-100);}
  .drawer-tab.active{color:#fff;background:linear-gradient(135deg,var(--navy-900),var(--navy-700));box-shadow:0 4px 14px rgba(21,42,110,.28);}
  @media print{ .sec-drawer, .sec-drawer-backdrop, .hamburger-btn{display:none !important;} }
  .card{background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);}
  .card+.card{margin-top:14px;}
  .section-title{font-family:var(--font-head);font-weight:700;font-size:14.5px;color:var(--navy-950);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--slate-600);margin-bottom:12px;}
  .field input,.field select,.field textarea{padding:10px 12px;border:1.5px solid var(--slate-200);border-radius:var(--radius-sm);font-size:14px;color:var(--slate-800);background:#fff;}
  .field input:hover,.field select:hover,.field textarea:hover{border-color:var(--slate-300);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 3.5px rgba(39,73,184,.14);}
  .btn{padding:10px 17px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;letter-spacing:.01em;}
  .btn-primary{background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;box-shadow:0 3px 10px rgba(21,42,110,.28);}
  .btn-primary:hover{box-shadow:0 5px 16px rgba(21,42,110,.36);filter:brightness(1.06);}
  .btn-orange{background:linear-gradient(135deg,var(--orange-500),var(--orange-600));color:#fff;box-shadow:0 3px 10px rgba(234,88,12,.28);}
  .btn-orange:hover{box-shadow:0 5px 16px rgba(234,88,12,.36);filter:brightness(1.05);}
  .btn-ghost{background:#fff;color:var(--slate-700);border:1.5px solid var(--slate-200);}
  .btn-ghost:hover{background:var(--slate-50);border-color:var(--slate-300);color:var(--navy-900);}
  .btn-danger{background:var(--red-100);color:var(--red-700);}
  .btn-danger:hover{background:var(--red-600);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;}
  .btn-full{width:100%;justify-content:center;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-md);padding:15px;box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s var(--ease);}
  .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .stat-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px;color:#fff;box-shadow:0 3px 8px rgba(15,31,71,.18);}
  .stat-val{font-family:var(--font-head);font-weight:800;font-size:19px;color:var(--navy-950);}
  .stat-label{font-size:11.5px;color:var(--slate-500);font-weight:600;margin-top:1px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:9px 8px;color:var(--slate-500);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--slate-100);}
  td{padding:11px 8px;border-bottom:1px solid var(--slate-100);}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .15s var(--ease);}
  tbody tr:hover{background:var(--slate-50);}
  .table-wrap{overflow-x:auto;border-radius:var(--radius-sm);}
  .pill{display:inline-flex;align-items:center;padding:3.5px 10px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.01em;}
  .pill-green{background:var(--emerald-100);color:var(--emerald-700);}
  .pill-red{background:var(--red-100);color:var(--red-700);}
  .pill-amber{background:#fef3c7;color:#b45309;}
  .pill-blue{background:#dbeafe;color:#1d4ed8;}
  .search-input{padding:10px 14px;border:1.5px solid var(--slate-200);border-radius:var(--radius-sm);font-size:13.5px;width:100%;max-width:280px;background:#fff;}
  .search-input:hover{border-color:var(--slate-300);}
  .search-input:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 3.5px rgba(39,73,184,.14);}
  .empty{text-align:center;padding:36px 10px;color:var(--slate-400);font-size:13.5px;}
  .link-back{font-size:12.5px;font-weight:700;color:var(--navy-700);display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;transition:gap .15s var(--ease),color .15s var(--ease);}
  .link-back:hover{color:var(--orange-600);gap:8px;}
  .checkbox-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--slate-200);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--slate-50);transition:border-color .15s var(--ease);}
  .checkbox-row:hover{border-color:var(--navy-300);}
  .checkbox-row input{width:17px;height:17px;accent-color:var(--navy-700);}
  .checkbox-row .cr-label{flex:1;font-size:13px;font-weight:600;color:var(--slate-700);}
  .checkbox-row .cr-amt{font-size:13px;font-weight:700;color:var(--navy-900);}
  .role-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;}
  .role-p{color:var(--slate-500);margin:16px 0 30px;text-align:center;max-width:340px;font-size:14px;}
  .brand-credit{color:var(--slate-400);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;}
  /* ---------- Splash screen (démarrage) ---------- */
  .splash-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:
      radial-gradient(circle at 15% 10%, rgba(39,73,184,.16) 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(245,158,11,.14) 0%, transparent 42%),
      linear-gradient(180deg,#0a1730 0%,#152a6e 60%,#0a1730 100%);
    text-align:center;animation:fadeIn .4s var(--ease);}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .splash-logo{width:118px;height:118px;border-radius:28px;object-fit:cover;box-shadow:0 12px 34px rgba(0,0,0,.35);animation:splashPop .5s var(--ease);}
  @keyframes splashPop{from{opacity:0;transform:scale(.85) translateY(10px);}to{opacity:1;transform:none;}}
  .splash-tagline{color:#c7d3f5;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 34px;}
  .splash-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;}
  .splash-screen .brand-credit{color:rgba(255,255,255,.55);margin-top:26px;}
  .install-hint{color:rgba(255,255,255,.5);font-size:11px;margin-top:12px;max-width:280px;line-height:1.5;}
  .modal-box-wide{max-width:680px;}
  .role-card{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--slate-200);border-radius:var(--radius-xl);padding:19px;text-align:left;width:100%;max-width:380px;margin-bottom:13px;box-shadow:var(--shadow-sm);}
  .role-card:hover{border-color:var(--navy-700);transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .role-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;color:#fff;box-shadow:0 3px 10px rgba(15,31,71,.2);}
  .role-title{font-family:var(--font-head);font-weight:700;color:var(--navy-950);font-size:15px;}
  .role-desc{font-size:12.5px;color:var(--slate-500);margin-top:2px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,45,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:overlayIn .15s var(--ease);}
  .modal-box{background:#fff;border-radius:var(--radius-xl);max-width:440px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow-lg);animation:modalIn .2s var(--ease);}
  .modal-title{font-family:var(--font-head);font-weight:700;font-size:16px;color:var(--navy-950);margin:0 0 14px;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
  .pin-dots{display:flex;gap:10px;justify-content:center;margin:18px 0;}
  .pin-dots input{width:44px;height:52px;text-align:center;font-size:22px;border-radius:var(--radius-sm);border:1.5px solid var(--slate-300);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-950);color:#fff;padding:11px 20px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;z-index:200;box-shadow:var(--shadow-lg);animation:toastIn .25s var(--ease);}
  .toast.err{background:var(--red-700);}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
  .balance-box{display:flex;justify-content:space-between;background:linear-gradient(135deg,var(--navy-950),var(--navy-700) 65%,var(--navy-600));color:#fff;border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-md);flex-wrap:wrap;gap:10px;}
  .balance-box .lbl{font-size:11px;opacity:.78;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .balance-box .val{font-family:var(--font-head);font-weight:800;font-size:19px;margin-top:3px;}
  .print-only{display:none;}
  /* ---------- Rapports ---------- */
  .rapport-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .rapport-card{background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);}
  .rapport-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--navy-300);}
  .rapport-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;margin-bottom:11px;box-shadow:0 3px 8px rgba(15,31,71,.18);}
  .rapport-title{font-family:var(--font-head);font-weight:700;font-size:13.5px;color:var(--navy-950);margin-bottom:4px;}
  .rapport-desc{font-size:11.5px;color:var(--slate-500);margin-bottom:14px;line-height:1.5;min-height:32px;}
  .filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--slate-50);border:1px solid var(--slate-200);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;}
  .filter-bar .field{margin-bottom:0;min-width:150px;}
  .summary-strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .summary-chip{flex:1;min-width:150px;background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-sm);}
  .summary-chip .lbl{font-size:10.5px;color:var(--slate-500);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .summary-chip .val{font-family:var(--font-head);font-weight:800;font-size:16.5px;color:var(--navy-950);margin-top:3px;}
  @media print{
    body *{visibility:hidden;}
    .print-area,.print-area *{visibility:visible;}
    .print-area{position:absolute;top:0;left:0;width:100%;}
    .no-print{display:none!important;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
    .bulletin-page{page-break-inside:avoid;}
    .bulletin-watermark,.bulletin-title,.bulletin-total-row td,.bulletin-section-bar,.bulletin-box-title,.bulletin-table th{
      -webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;
    }
  }
  @page{size:A4 portrait;margin:12mm;} /* valeur par défaut avant l'injection dynamique (voir setupPrintPage() dans app.js) */
  /* ---------- Diplôme (reproduction fidèle du modèle officiel, variables en couleur) ---------- */
  .diplome-scale-wrap{width:calc(297mm*0.56);height:calc(210mm*0.56);overflow:hidden;margin:0 auto;box-shadow:var(--shadow-lg);border-radius:4px;}
  .diplome-canvas{width:297mm;height:210mm;position:relative;transform:scale(0.56);transform-origin:top left;background:#fdfbf4;font-family:var(--font-diploma-body);padding:6mm 17mm 9mm 14mm;box-sizing:border-box;color:#1e293b;overflow:hidden;}
  .diplome-bgline{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:repeating-linear-gradient(70deg,rgba(10,25,55,.025) 0 1px,transparent 1px 14px);}
  .diplome-border{position:absolute;inset:4.5mm;border:.6mm solid #c79a3f;border-radius:1.5mm;pointer-events:none;z-index:5;}
  .diplome-border::before{content:"";position:absolute;inset:1.6mm;border:.3mm solid #c79a3f;border-radius:1mm;opacity:.85;}
  /* Coin haut-gauche : grand élément navy avec courbe dorée élégante */
  .diplome-corner-tl{position:absolute;top:0;left:0;width:54mm;height:70mm;z-index:1;pointer-events:none;}
  .diplome-corner-tl svg{width:100%;height:100%;display:block;}
  /* Coin bas-droit : plusieurs bandes courbes navy superposées, liserés dorés */
  .diplome-corner-br{position:absolute;bottom:0;right:0;width:96mm;height:74mm;z-index:1;pointer-events:none;}
  .diplome-corner-br svg{width:100%;height:100%;display:block;}
  /* Grande vague navy en bas (~17% de la hauteur) avec courbes dorées parallèles */
  .diplome-wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:17%;z-index:1;pointer-events:none;}
  .diplome-wave svg{width:100%;height:100%;display:block;}
  /* Ornements dorés subtils centre-haut / centre-bas */
  .diplome-orn-top{position:absolute;top:2.4mm;left:50%;transform:translateX(-50%);width:56mm;height:6mm;z-index:6;pointer-events:none;}
  .diplome-orn-top svg{width:100%;height:100%;display:block;}
  .diplome-orn-bottom{position:absolute;bottom:3mm;left:50%;transform:translateX(-50%);width:46mm;height:5mm;z-index:3;pointer-events:none;}
  .diplome-orn-bottom svg{width:100%;height:100%;display:block;}
  /* Filigrane : logo du centre (enregistré dans Paramètres) répété, concentré côté gauche */
  .diplome-wm{position:absolute;top:0;left:0;width:52%;height:100%;background-repeat:repeat;background-position:8mm 8mm;background-size:24mm 24mm;opacity:.055;pointer-events:none;z-index:1;filter:grayscale(1);}
  .diplome-id{font-family:var(--font-diploma-body);color:#B3261E;font-weight:800!important;font-size:1.42em;letter-spacing:.01em;text-shadow:.25px 0 currentColor,-.25px 0 currentColor;}
  .diplome-highlight{font-family:var(--font-diploma-body);color:#B3261E;font-weight:800!important;font-size:1.42em;letter-spacing:.01em;text-shadow:.25px 0 currentColor,-.25px 0 currentColor;}
  /* Cadre photo 3x4, positionné au milieu côté droit */
  /* Logo du centre, placé au-dessus de la photo de l'élève, remonté de 8pt (~2.8mm) puis de 1,5cm supplémentaires */
  .diplome-photo-logo{position:absolute;top:10.2mm;right:29mm;width:29mm;height:29mm;border-radius:50%;border:.6mm solid #c79a3f;background:#fff;box-shadow:0 1mm 2mm rgba(0,0,0,.12);overflow:hidden;z-index:4;}
  .diplome-photo-logo img{width:100%;height:100%;object-fit:contain;display:block;}
  .diplome-photo-logo .logo-badge{width:100%;height:100%;font-size:7mm;border-radius:0;border:none;}
  .diplome-photo-box{position:absolute;top:60mm;right:17mm;width:30mm;height:40mm;border:.9mm solid #0B1F4D;border-radius:1mm;background:#f4f2ec;overflow:hidden;z-index:4;box-shadow:0 0 0 .35mm #c79a3f,0 2mm 4mm rgba(0,0,0,.18);}
  .diplome-photo-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .diplome-photo-box .ph-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c2c9d6;font-size:13mm;background:#f4f2ec;}
  /* display:flex (et non plus grid) : html2canvas (utilisé pour l'export PDF) ne supporte pas
     fiablement CSS Grid et pouvait faire "tomber" le logo du centre sur une autre ligne dans le
     PDF généré, alors que l'affichage à l'écran semblait correct. Le flex garantit le même rendu
     à l'écran et dans le PDF exporté. */
  .diplome-header{display:flex;align-items:center;gap:3mm;position:relative;z-index:3;}
  .diplome-header-left{display:flex;align-items:center;justify-content:flex-start;flex:0 0 68mm;width:68mm;}
  .diplome-header-left-logo{width:70mm;height:auto;flex-shrink:0;margin-left:5mm;}
  .diplome-header-left-logo img{width:100%;height:auto;display:block;}
  /* Spacer invisible, même largeur que .diplome-header-left, pour que le titre central soit
     vraiment centré sur toute la largeur de la page (et non seulement dans l'espace restant
     à droite du logo) — flex plutôt que grid pour rester fidèle au rendu html2canvas (export PDF). */
  .diplome-header-right-spacer{flex:0 0 68mm;width:68mm;}
  .diplome-header-center{flex:1 1 auto;min-width:0;font-family:var(--font-head);font-weight:800;font-size:7.6mm;color:#0d1b3d;text-align:center;line-height:1.28;letter-spacing:.01em;}
  /* Diplômes filière pharma/délégué médical : logo ONPB nettement plus petit (le fichier source
     est un cadre quasi-carré, contrairement au logo du ministère qui est large et bas — à largeur
     égale il devenait beaucoup trop haut et poussait tout le contenu dans la vague du bas) */
  .diplome-canvas--green .diplome-header-left-logo{width:29mm;transform:translateY(4mm);}
  .diplome-mini-orn{display:flex;align-items:center;justify-content:center;gap:2mm;margin-top:2mm;}
  .diplome-mini-orn::before,.diplome-mini-orn::after{content:"";width:16mm;height:.3mm;background:#c79a3f;}
  .diplome-mini-orn span{color:#c79a3f;font-size:3mm;}
  .diplome-header-right{flex:0 0 34mm;width:34mm;height:34mm;border-radius:50%;border:.6mm solid #c79a3f;background:#fff;box-shadow:0 1mm 2mm rgba(0,0,0,.12);overflow:hidden;transform:translateY(-3mm);}
  .diplome-header-right img{width:100%;height:100%;object-fit:contain;display:block;}
  .diplome-header-right .logo-badge{width:100%;height:100%;font-size:9mm;border-radius:0;border:none;}
  .diplome-title-wrap{display:flex;align-items:center;justify-content:center;gap:3.5mm;margin-top:0mm;position:relative;z-index:3;}
  .diplome-flourish{width:20mm;height:5mm;flex-shrink:0;}
  .diplome-flourish svg{width:100%;height:100%;display:block;}
  .diplome-title{text-align:center;font-family:var(--font-diploma-head);font-weight:900;font-size:15mm;letter-spacing:.09em;color:#0d1b3d;}
  .diplome-numero{font-family:var(--font-head);font-weight:600;font-size:3.3mm;color:#334155;margin-top:1mm;text-align:center;position:relative;z-index:3;}
  .diplome-directeur-line{font-family:var(--font-head);font-weight:700;font-size:4.1mm;color:#0d1b3d;margin-top:2mm;position:relative;z-index:3;}
  .diplome-vu-list{margin:1.5mm 0 0;padding-left:5mm;padding-right:44mm;position:relative;z-index:3;list-style:none;}
  .diplome-vu-list li{font-family:var(--font-head);font-size:3.2mm;font-weight:500;color:#1e293b;line-height:1.48;margin-bottom:.6mm;position:relative;padding-left:4mm;}
  .diplome-vu-list li::before{content:"";position:absolute;left:0;top:1.5mm;width:1.6mm;height:1.6mm;border-radius:50%;background:#c98a1e;}
  .diplome-statement{font-family:var(--font-head);font-size:4mm;font-weight:500;line-height:1.6;position:relative;z-index:3;margin-top:2.4mm;padding-right:44mm;color:#1e293b;}
  .diplome-body{font-family:var(--font-head);font-size:3.9mm;font-weight:500;line-height:1.55;position:relative;z-index:3;margin-top:1.8mm;padding-right:44mm;color:#1e293b;}
  .diplome-fmrow{font-family:var(--font-head);font-size:3.9mm;font-weight:500;color:#1e293b;position:relative;z-index:3;margin-top:1.8mm;padding-right:44mm;}
  .diplome-final{font-family:var(--font-head);font-size:3.8mm;font-weight:500;color:#1e293b;margin-top:2mm;position:relative;z-index:3;padding-right:20mm;}
  .diplome-fait-line{font-family:var(--font-head);font-size:3.6mm;font-weight:500;color:#1e293b;text-align:center;margin-top:2.5mm;position:relative;z-index:3;}
  .diplome-footer{position:absolute;z-index:4;right:52mm;bottom:30mm;width:60mm;text-align:center;}
  .diplome-sign-label{font-family:var(--font-head);font-weight:700;font-size:4mm;color:#0d1b3d;margin-bottom:16mm;}
  .diplome-sign-line{border-top:.35mm solid #c79a3f;width:48mm;margin:0 auto 2mm;}
  .diplome-sign-name{font-family:var(--font-head);font-weight:700;font-size:3.8mm;color:#0d1b3d;min-height:4.5mm;}
  .diplome-seal{position:absolute;bottom:7mm;left:14mm;width:27mm;height:27mm;z-index:3;}
  .diplome-seal svg{width:100%;height:100%;display:block;}
  /* Déclinaison verte du diplôme (filières Auxiliaire de Pharmacie / Délégué Médical) : les
     textes et liserés qui étaient en bleu marine passent en vert, le doré est conservé. */
  .diplome-canvas--green .diplome-header-center,
  .diplome-canvas--green .diplome-title,
  .diplome-canvas--green .diplome-directeur-line,
  .diplome-canvas--green .diplome-sign-label,
  .diplome-canvas--green .diplome-sign-name{color:#0B4D2E;}
  .diplome-canvas--green .diplome-photo-box{border-color:#0B4D2E;}
  @media print{
    html,body{margin:0!important;padding:0!important;background:#fff!important;width:297mm!important;height:210mm!important;}
    .diplome-scale-wrap{width:297mm!important;height:210mm!important;overflow:visible!important;box-shadow:none!important;border-radius:0!important;margin:0!important;}
    .diplome-canvas{width:297mm!important;height:210mm!important;transform:none!important;position:absolute!important;top:0!important;left:0!important;margin:0!important;padding:10mm 17mm 9mm 14mm!important;page-break-after:avoid;page-break-inside:avoid;}
  }
  /* ---------- Quittance de paiement : A4 portrait forcé, 2 exemplaires par page ---------- */
  .quittance-page{width:210mm;box-sizing:border-box;margin:0 auto;padding:10mm 12mm;background:#fff;}
  .quittance-slot{border:1px solid var(--slate-200);border-radius:10px;padding:16px;box-sizing:border-box;height:128mm;overflow:hidden;}
  .quittance-cut{text-align:center;color:var(--slate-400);font-size:10.5px;margin:6mm 0;border-top:1px dashed var(--slate-300);padding-top:6px;}
  @media print{
    html,body{margin:0!important;padding:0!important;background:#fff!important;}
    .print-area.quittance-page{
      width:210mm!important;height:297mm!important;
      margin:0!important;position:absolute!important;top:0!important;left:0!important;
      padding:10mm 12mm!important;box-sizing:border-box!important;
    }
    .quittance-slot{page-break-inside:avoid;}
  }
  .doc-header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--navy-900);padding-bottom:14px;margin-bottom:18px;}
  .doc-header .t1{font-family:var(--font-head);font-weight:800;font-size:17px;color:var(--navy-950);}
  .doc-header .t2{font-size:11.5px;color:var(--slate-500);}
  .cert{border:8px double var(--navy-900);border-radius:6px;padding:40px 30px;text-align:center;background:#fffdf8;}
  .cert h1{font-family:var(--font-head);font-size:26px;color:var(--navy-950);margin:6px 0;letter-spacing:.02em;}
  .cert .sub{font-size:12px;letter-spacing:.15em;color:var(--orange-600);font-weight:700;text-transform:uppercase;}
  .cert .name{font-family:var(--font-head);font-size:23px;color:var(--navy-900);margin:18px 0 6px;border-bottom:2px solid var(--slate-200);display:inline-block;padding:0 14px 6px;}
  .cert p{font-size:13.5px;color:var(--slate-700);line-height:1.7;}
  .sig-row{display:flex;justify-content:space-between;margin-top:44px;font-size:12px;color:var(--slate-600);}
  .sig-row-diploma>div{width:46%;text-align:center;padding-top:38px;border-top:1px solid var(--slate-300);}
  .fab-bottom{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

  /* ---------- Bulletin de notes ---------- */
  .bulletin-page{position:relative;overflow:hidden;background:#fff;width:186mm;min-height:273mm;box-sizing:border-box;margin:0 auto;display:flex;flex-direction:column;}
  @media print{
    /* Le bulletin doit remplir la page A4 entière, sans dépendre des marges appliquées par le
       navigateur/système au moment de l'enregistrement en PDF (marges gérées par @page, mises à 0
       dynamiquement par setupPrintPage() dans app.js) : on impose donc ses propres dimensions et
       son propre espacement interne, en position absolue plein cadre, comme pour le diplôme. */
    html,body{margin:0!important;padding:0!important;background:#fff!important;}
    .print-area.bulletin-page{
      width:210mm!important;height:297mm!important;
      margin:0!important;position:absolute!important;top:0!important;left:0!important;
      padding:14mm 16mm 16mm!important;
    }
  }
  .bulletin-watermark{position:absolute;inset:0;background-repeat:repeat;background-size:70px 70px;opacity:.07;pointer-events:none;z-index:0;}
  .bulletin-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;}
  .bulletin-spacer{flex:1 1 auto;min-height:8mm;}
  .bh2{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--navy-900);padding-bottom:10px;margin-bottom:2px;}
  .bh2-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .bh2-ministere-logo img{height:60px;width:auto;display:block;}
  .bh2-center{display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bh2-center img{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block;}
  .bh2-center .logo-badge{width:44px;height:44px;border-radius:10px;}
  .bh2-right{display:flex;align-items:flex-start;gap:6px;flex:1;justify-content:flex-end;text-align:right;}
  .bh2-flag{font-size:19px;line-height:1;}
  .bh2-info{font-size:10.5px;color:var(--slate-600);line-height:1.65;white-space:nowrap;}
  .bulletin-centerinfo{text-align:center;font-size:11px;color:var(--slate-600);margin:7px 0 0;line-height:1.6;}
  .bulletin-title{text-align:center;font-family:var(--font-head);font-weight:800;font-size:15px;color:#fff;background:var(--navy-900);border-radius:8px;padding:9px 6px;letter-spacing:.05em;margin:13px 0 13px;}
  .bulletin-studentinfo{display:grid;grid-template-columns:1fr 22mm 1fr;align-items:center;gap:4px 14px;font-size:12.5px;color:var(--slate-700);background:var(--slate-50);border:1px solid var(--slate-200);border-radius:8px;padding:11px 14px;margin-bottom:13px;}
  .bulletin-studentinfo-col{display:flex;flex-direction:column;gap:3px;}
  .bulletin-studentinfo-col-right{text-align:right;margin-left:auto;}
  .bulletin-studentinfo-photo{display:flex;align-items:center;justify-content:center;}
  .bulletin-photo-box{width:19mm;height:25mm;border:.5mm solid var(--navy-900);border-radius:1mm;overflow:hidden;background:#f4f2ec;box-shadow:0 1px 3px rgba(0,0,0,.15);flex-shrink:0;}
  .bulletin-photo-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .bulletin-photo-box .ph-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c2c9d6;font-size:18px;background:#f4f2ec;}
  .bulletin-section-bar{font-family:var(--font-head);font-weight:700;font-size:12px;letter-spacing:.03em;color:#fff;background:var(--navy-900);padding:7px 12px;border-radius:5px;margin-bottom:8px;}
  .bulletin-table{width:100%;border-collapse:collapse;margin-bottom:13px;}
  .bulletin-table th{background:var(--slate-100);text-align:left;padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--slate-600);border:1px solid var(--slate-200);}
  .bulletin-table td{border:1px solid var(--slate-200);}
  .bulletin-total-row td{font-weight:800;background:#fef3c7;color:var(--navy-950);padding:7px 8px;}
  .bulletin-recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px;color:var(--slate-700);margin-bottom:13px;}
  .bulletin-box{border:1px solid var(--slate-200);border-radius:8px;overflow:hidden;background:#fff;margin:13px 0 8px;}
  .bulletin-box-orange{border-left:4px solid var(--orange-500);}
  .bulletin-box-title{font-family:var(--font-head);font-weight:700;font-size:10.5px;letter-spacing:.03em;color:var(--navy-950);padding:8px 12px;border-bottom:1px solid var(--slate-100);}
  .bulletin-box-body{padding:11px 12px;min-height:44px;font-size:12.5px;color:var(--slate-700);}
  .bulletin-decision-list{column-count:2;column-gap:20px;}
  .bulletin-decision-item{display:flex;align-items:center;gap:8px;padding:3px 0;break-inside:avoid;}
  .bulletin-decision-box{font-size:15px;line-height:1;flex-shrink:0;}
  .bulletin-sign-block{margin:0 0 0 auto;width:60mm;text-align:center;}
  .bulletin-sign-label{font-family:var(--font-head);font-weight:700;font-size:13px;color:var(--navy-950);margin-bottom:18mm;}
  .bulletin-sign-line{border-top:1px solid var(--slate-400);width:48mm;margin:0 auto 2mm;}
  .bulletin-sign-name{font-family:var(--font-head);font-weight:700;font-size:12.5px;color:var(--navy-950);min-height:15px;}
</style>
